<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Exam Performance Predictor</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
      }

      .login {
        width: 100%;
        max-width: 650px;
        background: rgba(255, 255, 255, 0.97);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header .icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 15px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }

      .header h1 {
        color: #222;
        font-size: 30px;
        margin-bottom: 8px;
      }

      .header p {
        color: #777;
        font-size: 15px;
      }

      .form-title {
        font-size: 21px;
        color: #333;
        margin-bottom: 25px;
        padding-bottom: 12px;
        border-bottom: 2px solid #eeeeee;
      }

      .mb-3 {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #444;
        margin-bottom: 8px;
      }

      .form-control {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #fafafa;
        font-size: 15px;
        color: #333;
        outline: none;
        transition: 0.25s ease;
      }

      .form-control:focus {
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
      }

      select.form-control {
        cursor: pointer;
      }

      input[type="number"] {
        appearance: textfield;
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        opacity: 1;
      }

      .btn {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s ease;
        margin-top: 5px;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .btn:active {
        transform: translateY(0);
      }

      .result {
        margin-top: 28px;
        padding: 18px 20px;
        border-radius: 12px;
        background: #f5f7ff;
        border-left: 5px solid #667eea;
        text-align: center;
      }

      .result-title {
        font-size: 13px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
      }

      .result-value {
        font-size: 24px;
        font-weight: 700;
        color: #4c5fd5;
      }

      .footer {
        text-align: center;
        margin-top: 22px;
        color: #999;
        font-size: 12px;
      }

      @media (max-width: 600px) {
        .login {
          padding: 25px 20px;
        }

        .header h1 {
          font-size: 24px;
        }

        .form-title {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login">
      <div class="header">
        <div class="icon">🎓</div>
        <h1>Student Exam Performance</h1>
        <p>Predict your Mathematics score using student performance data</p>
      </div>

      <form action="{{ url_for('predict_datapoint')}}" method="post">
        <h1 class="form-title">Student Exam Performance Prediction</h1>

        <div class="mb-3">
          <label class="form-label">Gender</label>
          <select
            class="form-control"
            name="gender"
            placeholder="Enter you Gender"
            required
          >
            <option class="placeholder" selected disabled value="">
              Select your Gender
            </option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Race or Ethnicity</label>
          <select
            class="form-control"
            name="ethnicity"
            placeholder="Enter you ethnicity"
            required
          >
            <option class="placeholder" selected disabled value="">
              Select Ethnicity
            </option>
            <option value="group A">Group A</option>
            <option value="group B">Group B</option>
            <option value="group C">Group C</option>
            <option value="group D">Group D</option>
            <option value="group E">Group E</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Parental Level of Education</label>

          <select
            class="form-control"
            name="parental_level_of_education"
            placeholder="Enter you Parent Education"
            required
          >
            <option class="placeholder" selected disabled value="">
              Select Parent Education
            </option>

            <option value="associate's degree">associate's degree</option>

            <option value="bachelor's degree">bachelor's degree</option>

            <option value="high school">high school</option>

            <option value="master's degree">master's degree</option>

            <option value="some college">some college</option>

            <option value="some high school">some high school</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Lunch Type</label>

          <select
            class="form-control"
            name="lunch"
            placeholder="Enter you Lunch"
            required
          >
            <option class="placeholder" selected disabled value="">
              Select Lunch Type
            </option>

            <option value="free/reduced">free/reduced</option>

            <option value="standard">standard</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Test Preparation Course</label>

          <select
            class="form-control"
            name="test_preparation_course"
            placeholder="Enter you Course"
            required
          >
            <option class="placeholder" selected disabled value="">
              Select Test_course
            </option>

            <option value="none">None</option>

            <option value="completed">Completed</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label"> Writing Score out of 100 </label>

          <input
            class="form-control"
            type="number"
            name="writing_score"
            placeholder="Enter your Writing score"
            min="0"
            max="100"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label"> Reading Score out of 100 </label>

          <input
            class="form-control"
            type="number"
            name="reading_score"
            placeholder="Enter your Reading score"
            min="0"
            max="100"
            required
          />
        </div>

        <div class="mb-3">
          <input
            class="btn btn-primary"
            type="submit"
            value="Predict your Maths Score"
          />
        </div>
      </form>

      <div class="result">
        <div class="result-title">Prediction Result</div>

        <div class="result-value">{{results}}</div>
      </div>

      <div class="footer">Student Exam Performance Prediction System</div>
    </div>
  </body>
</html>
